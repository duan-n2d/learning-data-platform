<!doctype html>
<html lang="{{ language }}">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ title }} | {{ site_name }}</title>
  <meta name="description" content="{{ description or site.site_description }}" />
  <link rel="stylesheet" href="{{ root_prefix }}assets/styles.css" />
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <a class="brand" href="{{ home_url }}">
        <span class="brand-mark">DE</span>
        <span>{{ site_name }}</span>
      </a>
      <div class="search-box">
        <input id="searchInput" placeholder="{{ search_placeholder }}" autocomplete="off" />
        <div id="searchResults" class="search-results"></div>
      </div>
      <nav class="nav">
        {{ sidebar|safe }}
      </nav>
    </aside>
    <main class="content">
      <div class="topbar">
        <button id="themeToggle" class="theme-toggle">{{ theme_toggle }}</button>
        <span class="meta-pill">{{ meta_label }}</span>
        <a class="language-switch" href="{{ language_url }}" lang="{{ 'en' if language == 'vi' else 'vi' }}">{{ language_label }}</a>
      </div>
      <article class="article">
        {{ content|safe }}
      </article>
    </main>
  </div>
  <script>window.__ROOT_PREFIX__ = "{{ root_prefix }}"; window.__LANGUAGE__ = "{{ language }}";</script>
  <script src="{{ root_prefix }}assets/search.js"></script>
</body>
</html>
